name: CodeQL

# This card runs inside everybody's Home Assistant, so it is worth having a machine look
# at it as well as a person.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published rule finds old code rather than waiting for a change.
    - cron: '41 5 * * 1'

permissions:
  contents: read

jobs:
  analyse:
    name: Analyse
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The analysis reads the tree and runs nothing from it; no job needs the token on disk.
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          # dist/ is the bundle, generated from src/ - analysing it would report every
          # finding twice and point at a line nobody edits.
          config: |
            paths-ignore:
              - dist
              - node_modules

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: '/language:javascript-typescript'
