name: Dependabot auto-merge

# Patch and minor bumps of development dependencies are chores. CI still has to pass -
# this only removes the click, not the gate. For the gate to be real, `main` must have a
# ruleset requiring the "Lint and test", "Build", "Release notes" and "Dependency review"
# checks: without required checks, `gh pr merge --auto` merges the moment the PR opens,
# before CI has run. See SECURITY.md.
#
# The exception to "development dependencies are chores" is anything the release job runs
# while it holds a token that can write to the repository and publish the asset every
# install downloads. That is not only semantic-release and its plugins: its prepare step
# runs `npm run build`, so eslint, typescript-eslint, prettier, TypeScript, rollup and every
# rollup plugin execute in the same process as the token, and any of them could rewrite
# dist/ before it is committed and attached. A bump to any of those waits for a person,
# whatever its version step. dependabot.yml groups them as release-tooling so the rest -
# tooling only the test jobs run - still merges on its own.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    # Both checked: `github.actor` is who triggered the run, `pull_request.user.login` is who
    # opened the PR - requiring both closes the gap where a re-triggered event carries a
    # different actor than the author.
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The comparison script, from the base branch: this event's default checkout is the base,
      # never the pull request's code, and the ref is named so that stays true. Only the one
      # file is taken, and nothing from the pull request is ever run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: scripts/lockfile-changes.js
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check the lockfile only re-resolves the bumped packages' own trees
        # The name checks below look at what Dependabot says it bumped. The lockfile can
        # change more than that: a bump of c8 can move a copy of semver, minimatch or
        # supports-color that eslint, rollup and semantic-release load too, and the
        # cooldown in dependabot.yml does not apply to those. So both lockfiles are read, the
        # base's and the pull request's, and compared package by package: any entry added,
        # removed or changed outside the bumped packages' own node_modules trees leaves the
        # PR for a person (review 2026-10-25). Reading the diff instead missed a version
        # changed in place, whose `"node_modules/x": {` line is context (review 2026-11-27).
        # The lockfiles are only ever parsed as JSON. A step that fails leaves own_tree unset,
        # which is not 'true', so nothing merges.
        id: lock
        run: |
          set -euo pipefail
          fetch() {
            gh api -H "Accept: application/vnd.github.raw+json" "repos/$REPO/contents/package-lock.json?ref=$1" > "$2"
          }
          fetch "$BASE_SHA" "$RUNNER_TEMP/base-lock.json"
          fetch "$HEAD_SHA" "$RUNNER_TEMP/head-lock.json"
          outside=$(node scripts/lockfile-changes.js "$RUNNER_TEMP/base-lock.json" "$RUNNER_TEMP/head-lock.json" "$NAMES")
          if [ -n "$outside" ]; then
            echo "left for a person: the lockfile also changes"
            echo "$outside"
            echo "own_tree=false" >> "$GITHUB_OUTPUT"
          else
            echo "own_tree=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          NAMES: ${{ steps.meta.outputs.dependency-names }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Let it merge itself once the checks are green
        # Only patch and minor bumps of development dependencies merge unattended. A runtime
        # dependency ends up in the bundle every install loads, and a major bump can change
        # behaviour - both want a person to look, whatever the version step.
        #
        # The name checks are substring matches over a comma-separated list, so each one
        # covers a family: 'rollup' also catches rollup-plugin-* and @rollup/*, 'eslint'
        # catches eslint-*, typescript-eslint and @typescript-eslint/*, 'typescript' the
        # compiler, 'conventional-changelog' the notes preset, 'ts-json-schema-generator' what
        # `npm run schema` runs inside the release build. They must keep matching the
        # release-tooling patterns in dependabot.yml.
        if: >-
          steps.lock.outputs.own_tree == 'true' &&
          steps.meta.outputs.dependency-type == 'direct:development' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor') &&
          !contains(steps.meta.outputs.dependency-names, 'semantic-release') &&
          !contains(steps.meta.outputs.dependency-names, 'conventional-changelog') &&
          !contains(steps.meta.outputs.dependency-names, 'rollup') &&
          !contains(steps.meta.outputs.dependency-names, 'terser') &&
          !contains(steps.meta.outputs.dependency-names, 'typescript') &&
          !contains(steps.meta.outputs.dependency-names, 'tslib') &&
          !contains(steps.meta.outputs.dependency-names, 'eslint') &&
          !contains(steps.meta.outputs.dependency-names, 'prettier') &&
          !contains(steps.meta.outputs.dependency-names, 'ts-json-schema-generator')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
