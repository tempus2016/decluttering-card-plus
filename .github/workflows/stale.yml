name: Close stale issues

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  stale:
    name: Sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          # Only chase issues explicitly waiting on the reporter. The tracker as a
          # whole is never swept - an old bug is still a bug.
          only-labels: needs-info
          days-before-stale: 21
          days-before-close: 10
          stale-issue-label: stale
          stale-issue-message: >
            This has been waiting on more information for a while. If it is still
            happening, reply with the detail asked for above and it will be reopened
            for another look. Otherwise it will close in 10 days.
          close-issue-message: >
            Closing for now, as there is not enough information to reproduce it.
            Comment any time and it can be reopened.
          days-before-pr-stale: -1
          days-before-pr-close: -1
