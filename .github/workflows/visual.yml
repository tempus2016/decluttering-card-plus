name: Screens

# Visual regression (idea 62): a Home Assistant in a service container, the demo dashboard
# written into it, every view screenshotted at a desktop and a phone width, and each image
# compared with the one kept in test/visual/baseline/. A view that drifts past the threshold
# fails the job and the before, after and diff images are attached as the "screens" artifact.
#
# To accept a change on purpose, run `node scripts/visual.js --update` locally and commit
# test/visual/baseline/, saying why in the pull request.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['src/**', 'examples/demo-dashboard.yaml', 'test/visual/**', 'scripts/visual.js', '.github/workflows/visual.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  screens:
    name: Screens
    runs-on: ubuntu-latest
    services:
      homeassistant:
        image: ghcr.io/home-assistant/home-assistant:stable
        ports:
          - 8123:8123
        volumes:
          - ${{ github.workspace }}/.ha:/config
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 22.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install a Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Build the card
        run: npm run rollup

      # The container mounts .ha as /config; the bundle goes where /local/ serves it from.
      - name: Put the bundle where Home Assistant serves it
        run: |
          mkdir -p .ha/www
          cp dist/*.js dist/*.js.map .ha/www/

      # /local/ is only served when www/ existed at start-up, and the service started before
      # the checkout made it. A restart picks it up.
      - name: Restart Home Assistant so it serves www/
        run: |
          docker restart ${{ job.services.homeassistant.id }}
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8123/ >/dev/null; then break; fi
            sleep 5
          done

      # A fresh Home Assistant has no user. Onboarding makes one and hands back a code that
      # becomes a token; the token writes the resource and the dashboard.
      - name: Onboard and make a token
        id: token
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8123/api/onboarding >/dev/null; then break; fi
            sleep 5
          done
          CODE=$(curl -sf -X POST http://localhost:8123/api/onboarding/users \
            -H 'Content-Type: application/json' \
            -d '{"client_id":"http://localhost:8123/","name":"screens","username":"screens","password":"screens-password-1","language":"en"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["auth_code"])')
          TOKEN=$(curl -sf -X POST http://localhost:8123/auth/token \
            -d "grant_type=authorization_code&code=$CODE&client_id=http://localhost:8123/" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          curl -sf -X POST http://localhost:8123/api/onboarding/core_config -H "Authorization: Bearer $TOKEN" >/dev/null || true
          curl -sf -X POST http://localhost:8123/api/onboarding/analytics -H "Authorization: Bearer $TOKEN" >/dev/null || true
          curl -sf -X POST http://localhost:8123/api/onboarding/integration -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' -d '{"client_id":"http://localhost:8123/","redirect_uri":"http://localhost:8123/"}' >/dev/null || true
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Register the card as a resource
        env:
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          node - <<'EOF'
          const sock = new WebSocket('ws://localhost:8123/api/websocket');
          let id = 1;
          sock.addEventListener('message', (ev) => {
            const msg = JSON.parse(ev.data);
            if (msg.type === 'auth_required') sock.send(JSON.stringify({ type: 'auth', access_token: process.env.TOKEN }));
            else if (msg.type === 'auth_ok') sock.send(JSON.stringify({ id: id++, type: 'lovelace/resources/create', res_type: 'module', url: '/local/decluttering-card-plus.js' }));
            else if (msg.id) { console.log('resource', msg.success ? 'created' : JSON.stringify(msg.error)); sock.close(); process.exit(msg.success ? 0 : 1); }
          });
          EOF

      - name: Render every view and compare with the baseline
        env:
          VISUAL_HA: http://localhost:8123
          VISUAL_TOKEN: ${{ steps.token.outputs.token }}
          # CI's own baselines: a fresh Home Assistant has other entities than the dev one. The
          # first run writes them (kept in the uploaded images) for committing to the repository.
          VISUAL_BASELINE: test/visual/baseline-ci
        run: node scripts/visual.js --local --write-missing

      - name: Keep the before, after and diff images
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screens
          path: |
            test/visual/out/
            test/visual/baseline-ci/
          if-no-files-found: ignore
