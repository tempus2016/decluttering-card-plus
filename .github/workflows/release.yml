name: Release

on: workflow_dispatch

# semantic-release tags the commit, pushes the changelog and version bump back, and
# creates the GitHub release. The default token is read-only, so all three would fail.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-bundle:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'

    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # semantic-release authenticates its own pushes with GITHUB_TOKEN, so the
          # checkout credentials are not needed and would only sit in .git/config
          # while the release build runs.
          persist-credentials: false
      - name: Use Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
