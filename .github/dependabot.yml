version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    # Don't bump onto a release that is hours old — a freshly published action
    # version is the one most likely to be yanked or compromised.
    cooldown:
      default-days: 7

  # Build tooling only. lit is the one runtime dependency that ends up in the
  # bundle, so it is deliberately left out of the group and raises its own PR.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    cooldown:
      default-days: 7
    groups:
      build-tooling:
        dependency-type: 'development'
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint's peer range is >=4.8.4 <6.1.0, so TypeScript 7 breaks
      # `npm run lint` — and lint is the first half of `npm run build`. Revisit
      # once typescript-eslint declares TS 7 support.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      # conventional-changelog-conventionalcommits 10 swapped its template
      # engine for @conventional-changelog/template, but semantic-release 25
      # resolves conventional-changelog-writer 8, which expects the old shape.
      # The preset loads without error and renders an empty changelog -- the
      # release notes drop to just the version heading. It also raises
      # engines.node to >=22, which the 20.x leg of the build matrix violates.
      # Revisit when semantic-release moves to the v9+ conventional-changelog
      # family. Evidence: PR #42.
      - dependency-name: 'conventional-changelog-conventionalcommits'
        update-types:
          - 'version-update:semver-major'
