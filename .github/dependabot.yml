version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    # Don't bump onto a release that is hours old — a freshly published action
    # version is the one most likely to be yanked or compromised.
    cooldown:
      default-days: 7

  # Build tooling only. The runtime dependencies - lit, js-yaml, custom-card-helpers and
  # home-assistant-js-websocket - end up in the bundle, so they are deliberately left out
  # of the groups and each raises its own PR, which nothing merges unattended.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    cooldown:
      default-days: 7
    groups:
      # Everything the release job executes while it holds a token that can write to the
      # repository and publish the asset. That is more than semantic-release itself: its
      # prepare step runs `npm run build`, which is `eslint .` and then `rollup -c`, so the
      # linter, typescript-eslint, prettier, TypeScript and every rollup plugin the config
      # imports all run in the token-holding process, and the notes preset loads inside
      # semantic-release. Any of them could rewrite dist/ or reach the token, so a bump to
      # any of them waits for a person (workflows/dependabot-auto-merge.yml excludes the
      # same names). What is left to merge on its own is tooling only the test jobs run.
      release-tooling:
        dependency-type: 'development'
        patterns:
          - 'semantic-release'
          - '@semantic-release/*'
          - 'conventional-changelog-*'
          - 'rollup'
          - 'rollup-plugin-*'
          - '@rollup/*'
          - 'terser'
          - 'typescript'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - 'tslib'
          - 'eslint'
          - 'eslint-*'
          - 'prettier'
        update-types:
          - minor
          - patch
      # Today that is c8 and ts-lit-plugin.
      build-tooling:
        dependency-type: 'development'
        exclude-patterns:
          - 'semantic-release'
          - '@semantic-release/*'
          - 'conventional-changelog-*'
          - 'rollup'
          - 'rollup-plugin-*'
          - '@rollup/*'
          - 'terser'
          - 'typescript'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - 'tslib'
          - 'eslint'
          - 'eslint-*'
          - 'prettier'
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint's peer range is >=4.8.4 <6.1.0, so TypeScript 7 breaks
      # `npm run lint` — and lint is the first half of `npm run build`. Revisit
      # once typescript-eslint declares TS 7 support.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      # conventional-changelog-conventionalcommits 10 swapped its template
      # engine for @conventional-changelog/template, but semantic-release 25
      # resolves conventional-changelog-writer 8, which expects the old shape.
      # The preset loads without error and renders an empty changelog -- the
      # release notes drop to just the version heading. It also raises
      # engines.node to >=22, which the 20.x leg of the build matrix violates.
      # Revisit when semantic-release moves to the v9+ conventional-changelog
      # family. Evidence: PR #42.
      - dependency-name: 'conventional-changelog-conventionalcommits'
        update-types:
          - 'version-update:semver-major'
