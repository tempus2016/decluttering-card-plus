name: Feature Request
description: Suggest something the card should be able to do
title: "[FR]: "
labels: ["enhancement", "needs-triage"]
assignees:
  - tempus2016

body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. If it is something the original card could never do, say so — this
        fork exists to move things forward.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem, rather than the solution. What does your configuration look like today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like the card to do?
      description: If you can sketch the YAML you wish worked, do.
      render: yaml
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
      description: Other cards, conditional cards, card-mod, templates in the raw editor.
    validations:
      required: false
